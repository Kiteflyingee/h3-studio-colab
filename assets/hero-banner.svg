<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="H3 Studio Colab Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="52%" stop-color="#101829" />
      <stop offset="100%" stop-color="#0B1324" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162036" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0E1525" stop-opacity="0.96" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Outer Rounded Studio Card -->
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#bgGrad)" stroke="#24324B" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#gridPattern)" />
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#glowRight)" />

  <!-- Top Accent Line -->
  <rect x="56" y="2" width="260" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Left Column: Brand & Value Proposition -->
  <!-- Eyebrow Pill -->
  <rect x="56" y="42" width="388" height="28" rx="14" fill="#152238" stroke="#2D4263" stroke-width="1" />
  <circle cx="74" cy="56" r="4.5" fill="#34D399" />
  <text x="88" y="60.5" fill="#93C5FD" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.6">MINIMAX H3 NATIVE  ×  WEPENERD H3 RIPPLE  ·  v4.0</text>

  <!-- Main Title -->
  <text x="56" y="128" fill="#F8FAFC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8">
    H3 Studio <tspan fill="url(#accentGrad)">Colab</tspan>
  </text>

  <!-- Subtitle -->
  <text x="56" y="168" fill="#E2E8F0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">
    云端多模态视频工作室 · 两步确认式爆款复刻引擎
  </text>

  <!-- Description -->
  <text x="56" y="204" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">
    通过 Google Colab CLI 一键调度云端 GPU，打通「锚点精修对比确认 → 6 步 LCM 视频扩散 →
  </text>
  <text x="56" y="226" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">
    多镜头原创导演 → 原生音画与免 GPU 字幕合成」全链路可复现工作流。
  </text>

  <!-- Feature Pills -->
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'PingFang SC', sans-serif" font-size="12" font-weight="600">
    <rect x="56" y="258" width="172" height="32" rx="8" fill="#131E33" stroke="#2C3E5D" />
    <text x="142" y="278.5" fill="#38BDF8" text-anchor="middle">/h3-studio-colab</text>

    <rect x="240" y="258" width="154" height="32" rx="8" fill="#131E33" stroke="#2C3E5D" />
    <text x="317" y="278.5" fill="#A5B4FC" text-anchor="middle">P-H3 仿射锁背景</text>

    <rect x="406" y="258" width="152" height="32" rx="8" fill="#131E33" stroke="#2C3E5D" />
    <text x="482" y="278.5" fill="#34D399" text-anchor="middle">6-Step H3 Ripple</text>

    <rect x="570" y="258" width="128" height="32" rx="8" fill="#131E33" stroke="#2C3E5D" />
    <text x="634" y="278.5" fill="#FCD34D" text-anchor="middle">SHA256 全锁定</text>
  </g>

  <!-- Right Column: Visual Two-Step Pipeline Diagram -->
  <g transform="translate(736, 36)">
    <!-- Container Panel -->
    <rect x="0" y="0" width="412" height="268" rx="16" fill="url(#cardGrad)" stroke="#2A3B59" stroke-width="1.5" />

    <!-- Window Header Dots -->
    <circle cx="20" cy="20" r="4.5" fill="#EF4444" fill-opacity="0.85" />
    <circle cx="35" cy="20" r="4.5" fill="#F59E0B" fill-opacity="0.85" />
    <circle cx="50" cy="20" r="4.5" fill="#10B981" fill-opacity="0.85" />
    <text x="70" y="24" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="11">scripts/h3studio.py · Golden Remake Flow</text>
    <line x1="0" y1="38" x2="412" y2="38" stroke="#1E2D45" stroke-width="1" />

    <!-- Step 1 Box -->
    <rect x="20" y="54" width="372" height="76" rx="10" fill="#111C30" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.2" />
    <rect x="32" y="66" width="58" height="20" rx="5" fill="#0C4A6E" />
    <text x="61" y="80" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">STEP 1</text>
    <text x="100" y="80.5" fill="#F1F5F9" font-family="'JetBrains Mono', 'PingFang SC', monospace" font-size="13" font-weight="700">remake-anchors</text>
    <text x="32" y="103" fill="#94A3B8" font-family="'Inter', 'PingFang SC', sans-serif" font-size="12">P-H3-Image 改首尾锚点 + 仿射对齐锁背景</text>
    <text x="32" y="120" fill="#38BDF8" font-family="'Inter', 'PingFang SC', sans-serif" font-size="11.5" font-weight="600">✓ 秒级输出「原帧 | 改后帧」对比图确认形象</text>

    <!-- Mini Split Compare Preview Icon inside Step 1 -->
    <rect x="308" y="66" width="72" height="52" rx="6" fill="#0B1322" stroke="#334155" stroke-width="1" />
    <line x1="344" y1="66" x2="344" y2="118" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,2" />
    <text x="326" y="96" fill="#64748B" font-family="'Inter', 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">原帧</text>
    <text x="362" y="96" fill="#34D399" font-family="'Inter', 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">改后</text>

    <!-- Connector Arrow -->
    <line x1="206" y1="130" x2="206" y2="148" stroke="#818CF8" stroke-width="2" />
    <polygon points="201,145 211,145 206,152" fill="#818CF8" />
    <rect x="218" y="133" width="114" height="17" rx="8.5" fill="#1E1B4B" stroke="#4338CA" stroke-width="0.8" />
    <text x="275" y="144.5" fill="#C7D2FE" font-family="'JetBrains Mono', 'PingFang SC', monospace" font-size="9.5" text-anchor="middle">--confirmed 复用热机</text>

    <!-- Step 2 Box -->
    <rect x="20" y="154" width="372" height="76" rx="10" fill="#111C30" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.2" />
    <rect x="32" y="166" width="58" height="20" rx="5" fill="#064E3B" />
    <text x="61" y="180" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">STEP 2</text>
    <text x="100" y="180.5" fill="#F1F5F9" font-family="'JetBrains Mono', 'PingFang SC', monospace" font-size="13" font-weight="700">remake-render</text>
    <text x="32" y="203" fill="#94A3B8" font-family="'Inter', 'PingFang SC', sans-serif" font-size="12">WepeNerd H3 Ripple 6 步 LCM 全片传播</text>
    <text x="32" y="220" fill="#34D399" font-family="'Inter', 'PingFang SC', sans-serif" font-size="11.5" font-weight="600">✓ 自动串联 TTS 配音 / 字幕擦除烧录直出 MP4</text>

    <!-- Mini Filmstrip Output Badge inside Step 2 -->
    <rect x="308" y="166" width="72" height="52" rx="6" fill="#06281E" stroke="#10B981" stroke-opacity="0.6" stroke-width="1" />
    <polygon points="338,183 338,199 353,191" fill="#34D399" />
    <text x="344" y="212" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">720P MP4</text>

    <!-- Bottom Status Strip -->
    <text x="20" y="252" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">GPU: L4 · G4 · A100 (fp16 VAE) · H100  |  Local ComfyUI</text>
  </g>
</svg>
