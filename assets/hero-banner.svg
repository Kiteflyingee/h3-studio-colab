<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="H3 Studio Colab">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#dots)" />

  <!-- Left Side: Project Title & Plain Developer Intro -->
  <rect x="52" y="48" width="156" height="26" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
  <circle cx="68" cy="61" r="4" fill="#3FB950" />
  <text x="80" y="65" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12">h3-studio-colab</text>

  <text x="52" y="128" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
    H3 Studio Colab
  </text>

  <text x="52" y="168" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500">
    本机无独显也能跑的视频改版与多镜头生成工具
  </text>

  <text x="52" y="204" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">
    通过本地 CLI 或 AI Agent 调用 Google Colab 云端 GPU：
  </text>
  <text x="52" y="226" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">
    先出关键帧对比图确认人物/商品，再渲染成片与字幕配音。
  </text>

  <!-- Plain Technical Tags -->
  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', sans-serif" font-size="12" fill="#8B949E">
    <rect x="52" y="252" width="116" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="110" y="270" text-anchor="middle">Colab CLI</text>

    <rect x="178" y="252" width="128" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="242" y="270" text-anchor="middle">关键帧对比确认</text>

    <rect x="316" y="252" width="116" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="374" y="270" text-anchor="middle">多镜头拼接</text>

    <rect x="442" y="252" width="128" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="506" y="270" text-anchor="middle">Agent Skill</text>
  </g>

  <!-- Right Side: Authentic Terminal Window -->
  <g transform="translate(628, 36)">
    <rect x="0" y="0" width="524" height="248" rx="10" fill="#090C10" stroke="#30363D" stroke-width="1.2" />
    <line x1="0" y1="34" x2="524" y2="34" stroke="#21262D" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#FF5F56" />
    <circle cx="34" cy="17" r="5" fill="#FFBD2E" />
    <circle cx="50" cy="17" r="5" fill="#27C93F" />
    <text x="262" y="21" fill="#6E7681" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">zsh — h3studio.py</text>

    <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'PingFang SC', monospace" font-size="12">
      <text x="20" y="62" fill="#79C0FF">$ python scripts/h3studio.py check</text>
      <text x="20" y="82" fill="#3FB950">✓ Colab CLI logged in · 0 active sessions</text>

      <text x="20" y="116" fill="#79C0FF">$ python scripts/h3studio.py remake-anchors job.json --gpu L4</text>
      <text x="20" y="136" fill="#8B949E">→ 切分镜头并生成首尾关键帧预览...</text>
      <text x="20" y="156" fill="#3FB950">✓ 已保存 anchors/remake_001_compare.png (原帧 | 改后帧)</text>

      <text x="20" y="190" fill="#79C0FF">$ python scripts/h3studio.py remake-render job.json --session s1 -o out.mp4</text>
      <text x="20" y="210" fill="#8B949E">→ 复用热机会话 s1 渲染全片并合成字幕...</text>
      <text x="20" y="230" fill="#3FB950">✓ 完成输出 out.mp4 (720P, 24fps)</text>
    </g>
  </g>
</svg>
