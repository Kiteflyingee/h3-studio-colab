<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="H3 Studio Colab">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="316" rx="16" fill="url(#dots)" />

  <!-- Left Side: Project Title & Dual-Mode Intro -->
  <rect x="52" y="48" width="224" height="26" rx="6" fill="#21262D" stroke="#30363D" stroke-width="1" />
  <circle cx="68" cy="61" r="4" fill="#3FB950" />
  <text x="80" y="65" fill="#C9D1D9" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12">CLI Tool &amp; AI Agent Skill</text>

  <text x="52" y="128" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
    H3 Studio Colab
  </text>

  <text x="52" y="168" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">
    Video remake &amp; multi-shot generation on Google Colab GPUs
  </text>

  <text x="52" y="204" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14">
    Install as a Plugin / AI Agent Skill for chat, or run directly from your terminal;
  </text>
  <text x="52" y="226" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14">
    preview side-by-side anchor frames first, then render full video, voiceover, and subtitles.
  </text>

  <!-- Plain Technical Tags -->
  <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B949E">
    <rect x="52" y="252" width="154" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="129" y="270" fill="#79C0FF" text-anchor="middle">/h3-studio-colab</text>

    <rect x="216" y="252" width="112" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="272" y="270" text-anchor="middle">h3studio.py</text>

    <rect x="338" y="252" width="128" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="402" y="270" text-anchor="middle">Anchor Preview</text>

    <rect x="476" y="252" width="124" height="28" rx="6" fill="#161B22" stroke="#30363D" />
    <text x="538" y="270" text-anchor="middle">Multi-Shot CLI</text>
  </g>

  <!-- Right Side: Authentic Terminal Window -->
  <g transform="translate(628, 36)">
    <rect x="0" y="0" width="524" height="248" rx="10" fill="#090C10" stroke="#30363D" stroke-width="1.2" />
    <line x1="0" y1="34" x2="524" y2="34" stroke="#21262D" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#FF5F56" />
    <circle cx="34" cy="17" r="5" fill="#FFBD2E" />
    <circle cx="50" cy="17" r="5" fill="#27C93F" />
    <text x="262" y="21" fill="#6E7681" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">Skill &amp; CLI</text>

    <g font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11.5">
      <text x="20" y="60" fill="#6E7681"># 1. Install as an Agent Skill (or clone to run CLI)</text>
      <text x="20" y="80" fill="#79C0FF">$ npx skills add Kiteflyingee/h3-studio-colab</text>

      <text x="20" y="114" fill="#6E7681"># 2. Preview edited keyframes before full video render</text>
      <text x="20" y="134" fill="#79C0FF">$ python scripts/h3studio.py remake-anchors job.json --gpu L4</text>
      <text x="20" y="154" fill="#3FB950">✓ Saved anchors/remake_001_compare.jpg (original | edited)</text>

      <text x="20" y="188" fill="#6E7681"># 3. Reuse warm session to render full video &amp; subtitles</text>
      <text x="20" y="208" fill="#79C0FF">$ python scripts/h3studio.py remake-render job.json --session s1 -o out.mp4</text>
      <text x="20" y="228" fill="#3FB950">✓ Wrote out.mp4 (720P, 24fps)</text>
    </g>
  </g>
</svg>
