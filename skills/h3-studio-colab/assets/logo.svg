<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="H3 Studio Colab Logo">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- ~11% transparent margin around 200x200 rounded square -->
  <rect x="28" y="28" width="200" height="200" rx="44" fill="url(#cardBg)" stroke="#334155" stroke-width="4" />
  <!-- Top film perforation bar -->
  <rect x="56" y="56" width="24" height="10" rx="4" fill="#475569" />
  <rect x="92" y="56" width="24" height="10" rx="4" fill="#475569" />
  <rect x="140" y="56" width="24" height="10" rx="4" fill="#475569" />
  <rect x="176" y="56" width="24" height="10" rx="4" fill="#475569" />
  <!-- Bold H3 + Play Motif -->
  <text x="56" y="160" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-2">H3</text>
  <polygon points="172,106 172,158 208,132" fill="url(#accent)" />
  <!-- Bottom timeline progress bar -->
  <rect x="56" y="186" width="144" height="8" rx="4" fill="#334155" />
  <rect x="56" y="186" width="94" height="8" rx="4" fill="url(#accent)" />
</svg>
