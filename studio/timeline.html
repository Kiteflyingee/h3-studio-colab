<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 Studio · 导演时间线</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#10151d;color:#eaf0f8}*{box-sizing:border-box}body{margin:0}header{padding:26px;border-bottom:1px solid #334155;background:#17202c}h1{margin:0 0 8px;font-size:24px}main{max-width:1180px;margin:24px auto;padding:0 20px}.muted{color:#a4b4c9;font-size:13px}button{padding:9px 14px;border:1px solid #40546b;border-radius:8px;background:#263b55;color:white;cursor:pointer}button.primary{background:#2469c3}input,select,textarea{width:100%;padding:9px;border-radius:6px;border:1px solid #40546b;background:#111923;color:#eaf0f8;font:inherit}textarea{min-height:78px;resize:vertical}label{display:block;font-size:12px;color:#a4b4c9;margin:10px 0 5px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between}.rail{display:flex;gap:4px;overflow:auto;background:#17202c;border-radius:10px;padding:10px;margin:20px 0}.seg{padding:8px;min-width:75px;background:#234b79;border-radius:5px;font-size:12px}.shot{border:1px solid #34455a;background:#192432;border-radius:12px;margin:14px 0;padding:18px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:14px}.refs{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.status{font-size:12px;border:1px solid #54677e;border-radius:4px;padding:4px 8px}.danger{background:#66313d}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}video{max-width:220px;max-height:200px}.filelabel{display:inline;margin:0;cursor:pointer;padding:9px 14px;border:1px solid #40546b;border-radius:8px}#error{color:#ffb3b3;white-space:pre-wrap}@media(max-width:760px){.grid,.refs{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>H3 Studio · AI 导演时间线</h1><div class="muted">离线编辑分镜与素材路径；导出后重新编译和渲染。</div></header>
<main><div class="toolbar"><div><strong id="title"></strong><p id="info" class="muted"></p></div><div class="actions"><label class="filelabel">导入结果记录<input id="results" type="file" accept=".json" hidden></label><button onclick="addShot()">＋ 镜头</button><button class="primary" onclick="downloadScript()">导出分镜 JSON</button></div></div><p id="error"></p><div id="rail" class="rail"></div><section id="shots"></section><p class="muted">将导出的 JSON 保存在原素材目录，运行 director-compile。局部重做：run 清单.json --only 镜头ID --with-dependents。这里显示的状态来自导入的 results.json，不代表实时 GPU 连接。</p></main>
<script>
let script=__PAYLOAD__, results={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(i,k,v){if(k==='inputs')v=v.split('\n').map(x=>x.trim()).filter(Boolean);if(k==='seconds')v=Number(v);script.shots[i][k]=v;render()}
function move(i,d){let j=i+d;if(j<0||j>=script.shots.length)return;[script.shots[i],script.shots[j]]=[script.shots[j],script.shots[i]];render()}
function removeShot(i){script.shots.splice(i,1);render()}
function addShot(){let n=1;while(script.shots.some(x=>x.id==='shot'+String(n).padStart(2,'0')))n++;script.shots.push({id:'shot'+String(n).padStart(2,'0'),seconds:5,mode:'text',prompt:'Describe the shot, camera and audio.'});render()}
function select(i,k,options){let value=script.shots[i][k]??(k==='mode'?'text':k==='transition'?'cut':'auto');return `<select onchange="update(${i},'${k}',this.value)">${options.map(x=>`<option ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function input(i,k,value,type='text'){return `<input type="${type}" value="${esc(value)}" onchange="update(${i},'${k}',this.value)">`}
function render(){let cursor=0;document.getElementById('title').textContent=script.title||'未命名视频';document.getElementById('info').textContent=`${script.shots.length} 个镜头 · ${script.shots.reduce((n,x)=>n+(+x.seconds||0),0).toFixed(2)} 秒 · ${script.aspect||'9:16'}`;
document.getElementById('rail').innerHTML=script.shots.map(s=>{let start=cursor;cursor+=+s.seconds||0;return `<div class="seg" style="flex:${Math.max(+s.seconds||0,2)}">${esc(s.id)}<br>${start.toFixed(2)}–${cursor.toFixed(2)}s</div>`}).join('');
document.getElementById('shots').innerHTML=script.shots.map((s,i)=>`<article class="shot"><div class="toolbar"><strong>${i+1}. ${esc(s.id)}</strong><div class="actions"><span class="status">${esc(results[s.id]?.status||'未导入状态')}</span><button onclick="move(${i},-1)">上移</button><button onclick="move(${i},1)">下移</button><button class="danger" onclick="removeShot(${i})">删除</button></div></div><div class="grid"><div><label>名称</label>${input(i,'title',s.title||s.id)}</div><div><label>时长 2–15 秒</label>${input(i,'seconds',s.seconds,'number')}</div><div><label>模式</label>${select(i,'mode',['text','ref','frames'])}</div><div><label>转场</label>${select(i,'transition',['cut','fade_black'])}</div></div><label>提示词（参考需写 @图片1 / @视频1 等）</label><textarea onchange="update(${i},'prompt',this.value)">${esc(s.prompt)}</textarea><div class="refs"><div><label>参考路径（每行一个；相对剧本 JSON）</label><textarea onchange="update(${i},'inputs',this.value)">${esc((s.inputs||[]).join('\n'))}</textarea></div><div><label>首帧路径</label>${input(i,'first',s.first||'')}<label>尾帧路径</label>${input(i,'last',s.last||'')}</div><div><label>模型配置</label>${select(i,'profile',['auto','h3-fl2va-int8','h3-ref2va-int8','fasth3-omni-int8','prism-dmad-pdmd-int8'])}<label>有效 seed（选填）</label>${input(i,'seed',s.seed??'','number')}<label class="check"><input type="checkbox" ${s.continue_previous?'checked':''} onchange="update(${i},'continue_previous',this.checked)">生成式续接上一镜头</label></div></div>${results[s.id]?.error?`<p class="muted">${esc(results[s.id].error)}</p>`:''}</article>`).join('')}
document.getElementById('results').onchange=async e=>{try{results=JSON.parse(await e.target.files[0].text()).jobs||{};render()}catch(error){document.getElementById('error').textContent=error.message}};
function downloadScript(){let errors=[];if(!script.shots.length)errors.push('至少保留一个镜头');for(let i=0;i<script.shots.length;i++){let s=script.shots[i];if(!(s.seconds>=2&&s.seconds<=15))errors.push(`${s.id} 时长应为2–15秒`);if(s.continue_previous&&(i===0||s.mode!=='ref'))errors.push(`${s.id} 续接需为第二镜头起的 ref 模式`);if(s.seed==='')delete s.seed;else if(s.seed!==undefined)s.seed=Number(s.seed)}document.getElementById('error').textContent=errors.join('\n');if(errors.length)return;let url=URL.createObjectURL(new Blob([JSON.stringify(script,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='director-edited.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}render();
</script></body></html>
